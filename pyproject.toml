[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "extrato-ofx"
version = "1.0.0"
description = "Leitor local de extratos OFX bancários e de cartão, com valores exatos e cobertura explícita."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Contribuidores da LOFRANO TECNOLOGIA"}]
keywords = ["ofx", "bank-statement", "csv", "financial-data", "portugues"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = ["defusedxml==0.7.1"]

[project.optional-dependencies]
dev = ["build==1.5.0", "ofxtools==1.1.1", "markdown-it-py==4.0.0"]

[project.scripts]
extrato-ofx = "extrato_ofx.cli:main"

[project.urls]
Homepage = "https://lofranotecnologia.com.br"
Repository = "https://github.com/martinlofranodeoliveira/extrato-ofx"
Issues = "https://github.com/martinlofranodeoliveira/extrato-ofx/issues"

[tool.setuptools.packages.find]
where = ["src"]
